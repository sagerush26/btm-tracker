name: Nightly BTM Competitor Scan

on:
  workflow_dispatch: {}
  schedule:
    # 06:00 UTC = 1:00 AM America/Chicago during CDT (summer).
    # During CST (winter) this fires at 12:00 AM Central instead -- up to
    # ~1hr drift is fine for a nightly inventory snapshot.
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: nightly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run dealer scan
        run: python scanner/run_scan.py

      - name: Rebuild dashboard data
        run: python scanner/build.py

      - name: Commit updated data
        run: |
          git config user.name "BTM Competitor Tracker Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/scans.json data/competitors.json data/model-mix.json data/trends.json scanner/scan_output.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Nightly scan update $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Deploy to Vercel
        if: ${{ vars.VERCEL_DEPLOY_HOOK != '' }}
        run: |
          curl -X POST "${{ vars.VERCEL_DEPLOY_HOOK }}"
