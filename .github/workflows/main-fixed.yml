name: BTM Competitor Scan Fixed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanner requirements
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml playwright
          playwright install chromium

      - name: Run BTM competitor scan
        run: |
          python scanner/scan.py
      - name: Commit updated data
        run: |
          git config user.name "BTM Competitor Tracker"
          git config user.email "actions@users.noreply.github.com"

          git add data/scans.json
          git add data/trends.json
          git add data/model-mix.json
          git add data/competitors.json
          git add data/live-listings.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "Update competitor scan data"
          git pull --rebase origin main
          git push origin HEAD:main
