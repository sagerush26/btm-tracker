name: BTM Competitor Scan Fixed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanner requirements
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml playwright
          playwright install chromium

      - name: Run BTM competitor scan
        run: |
          python scanner/scan.py

      - name: Commit updated tracker data
        run: |
          git config user.name "BTM Competitor Tracker"
          git config user.email "actions@github.com"

          git add data/scans.json
          git add data/trends.json
          git add data/model-mix.json
          git add data/competitors.json

          if git diff --cached --quiet; then
            echo "No tracker changes to commit."
          else
            git commit -m "Update competitor scan data"
            git pull --rebase origin main
            git push origin main
          fi
